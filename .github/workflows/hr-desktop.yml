name: HR desktop
on:
  workflow_dispatch:
    inputs:
      platform:
        description: "仅构建所需安装包"
        type: choice
        required: true
        default: windows
        options:
          - windows
          - macos
          - all
  # Code uploads are free of build side effects. An explicit build tag also
  # works before this workflow has been merged into the default branch.
  push:
    tags:
      - "hr-desktop-build-windows-v*"
      - "hr-desktop-build-macos-v*"
      - "hr-desktop-build-all-v*"
concurrency:
  group: hr-desktop-${{ github.ref }}-${{ inputs.platform || 'tag' }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((inputs.platform == 'all' || startsWith(github.ref_name, 'hr-desktop-build-all-')) && '["windows-latest","macos-latest"]' || (inputs.platform == 'macos' || startsWith(github.ref_name, 'hr-desktop-build-macos-')) && '["macos-latest"]' || '["windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    defaults:
      run:
        working-directory: hr-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          version: "11.25.0"
      - run: pnpm install --frozen-lockfile
      - run: node node_modules/electron/install.js
      - run: python runtime/install.py
      - run: python runtime/build.py
      - run: npm test
      - run: python -m unittest discover -s runtime -p test_passive_runtime.py
      - run: python -m unittest discover -s runtime -p test_active_sourcing.py
      - run: python -m unittest discover -s runtime -p test_account_history.py
      - run: python -m unittest discover -s runtime -p test_local_session.py
      - run: python -m unittest discover -s runtime -p test_managed_jobs.py
      - run: python -m unittest discover -s runtime -p test_wire_output.py
      - run: python -m unittest discover -s runtime -p test_conversation_scope.py
      - run: python -m unittest discover -s ../scripts/boss-agent -p test_recruitment_demands.py
      - run: python -m unittest discover -s ../scripts/boss-agent -p test_passive_pool.py
      - run: python -m unittest discover -s ../scripts/boss-agent -p test_hr_sourcing.py
      - run: python -m unittest discover -s ../scripts/boss-agent -p test_resume_identity.py
      - run: python runtime/test_portable.py
      - run: python runtime/test_direct_network.py
      - run: python -m unittest discover -s ../scripts/boss-agent -p test_desktop_bridge.py
      - name: Offline floating-orb and BOSS-window smoke
        shell: bash
        run: |
          export HEYI_TEST_USER_DATA="$RUNNER_TEMP/heyi-desktop-ci"
          npm run smoke
      - name: Package
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            npm run dist:win
          else
            npm run dist:mac
          fi
      - name: Verify and smoke packaged macOS app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          app="release/mac-arm64/赫逸招聘助手.app"
          codesign --verify --deep --strict "$app"
          export HEYI_TEST_USER_DATA="$RUNNER_TEMP/heyi-packaged-test"
          export HEYI_TEST_OUTPUT="$PWD/test-results/packaged"
          "$app/Contents/MacOS/赫逸招聘助手" --self-test
          test -f "$HEYI_TEST_OUTPUT/smoke.json"
      - name: Packaged smoke on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:HEYI_TEST_USER_DATA="$env:RUNNER_TEMP\heyi-packaged-test"
          $env:HEYI_TEST_OUTPUT="$PWD\test-results\packaged"
          $process = Start-Process -FilePath "release\win-unpacked\赫逸招聘助手.exe" -ArgumentList "--self-test" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Packaged smoke failed: $($process.ExitCode)" }
          if (!(Test-Path "$env:HEYI_TEST_OUTPUT\smoke.json")) { throw "Missing packaged smoke result" }
      - name: Save verified installers in an unpublished draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="hr-desktop-v${version}-${GITHUB_SHA:0:8}"
          if ! gh release view "$tag" --json isDraft >/dev/null 2>&1; then
            gh release create "$tag" --draft --target "$GITHUB_SHA" \
              --title "HR desktop ${version} (${GITHUB_SHA:0:8})" \
              --notes "Verified desktop installers and offline QA. Draft retained for coordinated platform deployment." \
              || gh release view "$tag" --json isDraft >/dev/null
          fi
          test "$(gh release view "$tag" --json isDraft --jq '.isDraft')" = true
          python - <<'PY'
          import hashlib,json,os,pathlib,zipfile
          root=pathlib.Path("release")
          files=[p for p in root.iterdir() if p.suffix in {".exe",".dmg",".zip"}]
          assert files,"No installer was produced"
          manifest={"commit":os.environ["GITHUB_SHA"],"os":os.environ["RUNNER_OS"],
            "arch":os.environ["RUNNER_ARCH"],"artifacts":{}}
          for p in files:
              manifest["artifacts"][p.name]={"sha256":hashlib.sha256(p.read_bytes()).hexdigest(),"size":p.stat().st_size}
          prefix=root/("verified-"+os.environ["RUNNER_OS"])
          prefix.with_suffix(".json").write_text(json.dumps(manifest,indent=2),encoding="utf-8")
          with zipfile.ZipFile(str(prefix)+"-qa.zip","w",zipfile.ZIP_DEFLATED) as archive:
              for p in pathlib.Path("test-results").rglob("*"):
                  if p.is_file():archive.write(p,p.relative_to("test-results"))
          PY
          for asset in release/*.exe release/*.dmg release/*.zip release/verified-*.json; do
            if [ -f "$asset" ]; then gh release upload "$tag" "$asset" --clobber; fi
          done
