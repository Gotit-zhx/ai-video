name: HR desktop
on:
  workflow_dispatch:
    inputs:
      platform:
        description: "仅构建所需安装包"
        type: choice
        required: true
        default: windows
        options:
          - windows
          - macos
          - all
      nativeProbe:
        description: "隔离检查 Windows 原客户端；不打包稳定助手、不发布"
        type: boolean
        required: false
        default: false
      nativeWorkbench:
        description: "同时构建独立 Windows 改造测试版并离线验包，不发布"
        type: boolean
        required: false
        default: false
      retainWorkbench:
        description: "仅私有仓库：通过草稿 Release 临时保留已验包的 Windows 候选包"
        type: boolean
        required: false
        default: false
      deliverPrivate:
        description: "仅把已验收的私有 Windows 包传至一次性 OSS 上传地址"
        type: boolean
        required: false
        default: false
      privateRelease:
        description: "已通过验包的私有草稿 tag（仅传输模式）"
        type: string
        required: false
  # Code uploads are free of build side effects. An explicit build tag also
  # works before this workflow has been merged into the default branch.
  push:
    tags:
      - "hr-desktop-build-windows-v*"
      - "hr-desktop-build-macos-v*"
      - "hr-desktop-build-all-v*"
concurrency:
  group: hr-desktop-${{ github.ref }}-${{ inputs.platform || 'tag' }}-${{ inputs.nativeProbe || false }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  desktop:
    if: ${{ inputs.nativeProbe != true && inputs.deliverPrivate != true }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((inputs.platform == 'all' || startsWith(github.ref_name, 'hr-desktop-build-all-')) && '["windows-latest","macos-latest"]' || (inputs.platform == 'macos' || startsWith(github.ref_name, 'hr-desktop-build-macos-')) && '["macos-latest"]' || '["windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    defaults:
      run:
        working-directory: hr-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          version: "11.25.0"
      - run: pnpm install --frozen-lockfile
      - run: node node_modules/electron/install.js
      - run: python runtime/install.py
      - run: python -m unittest discover -s runtime -p test_build_manifest.py
      - run: python runtime/build.py
      - run: npm test
      - run: python -m unittest discover -s runtime -p test_passive_runtime.py
      - run: python -m unittest discover -s runtime -p test_boss_chat_receipts.py
      - run: python -m unittest discover -s runtime -p test_resume_reuse.py
      - run: python -m unittest discover -s runtime -p test_recommendation_budget.py
      - run: python -m unittest discover -s runtime -p test_desktop_budget.py
      - run: python -m unittest discover -s runtime -p test_active_sourcing.py
      - run: python -m unittest discover -s runtime -p test_account_history.py
      - run: python -m unittest discover -s runtime -p test_local_session.py
      - run: python -m unittest discover -s runtime -p test_managed_jobs.py
      - run: python -m unittest discover -s runtime -p test_wire_output.py
      - run: python -m unittest discover -s runtime -p test_conversation_scope.py
      - run: python -m unittest discover -s ../scripts/boss-agent -p test_recruitment_demands.py
      - run: python -m unittest discover -s ../scripts/boss-agent -p test_passive_pool.py
      - run: python -m unittest discover -s ../scripts/boss-agent -p test_hr_account_identity.py
      - run: python -m unittest discover -s ../scripts/boss-agent -p test_hr_sourcing.py
      - run: python -m unittest discover -s ../scripts/boss-agent -p test_resume_identity.py
      - run: python runtime/test_portable.py
      - run: python runtime/test_direct_network.py
      - run: python -m unittest discover -s ../scripts/boss-agent -p test_desktop_bridge.py
      - name: Offline floating-orb and BOSS-window smoke
        shell: bash
        run: |
          export HEYI_TEST_USER_DATA="$RUNNER_TEMP/heyi-desktop-ci"
          npm run smoke
      - name: Package
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            npm run dist:win
          else
            npm run dist:mac
          fi
      - name: Verify and smoke packaged macOS app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          app="release/mac-arm64/赫逸招聘助手.app"
          codesign --verify --deep --strict "$app"
          export HEYI_TEST_USER_DATA="$RUNNER_TEMP/heyi-packaged-test"
          export HEYI_TEST_OUTPUT="$PWD/test-results/packaged"
          "$app/Contents/MacOS/赫逸招聘助手" --self-test
          test -f "$HEYI_TEST_OUTPUT/smoke.json"
      - name: Packaged smoke on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:HEYI_TEST_USER_DATA="$env:RUNNER_TEMP\heyi-packaged-test"
          $env:HEYI_TEST_OUTPUT="$PWD\test-results\packaged"
          $process = Start-Process -FilePath "release\win-unpacked\赫逸招聘助手.exe" -ArgumentList "--self-test" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Packaged smoke failed: $($process.ExitCode)" }
          if (!(Test-Path "$env:HEYI_TEST_OUTPUT\smoke.json")) { throw "Missing packaged smoke result" }
      - name: Save verified installers in an unpublished draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="hr-desktop-v${version}-${GITHUB_SHA:0:8}"
          if ! gh release view "$tag" --json isDraft >/dev/null 2>&1; then
            gh release create "$tag" --draft --target "$GITHUB_SHA" \
              --title "HR desktop ${version} (${GITHUB_SHA:0:8})" \
              --notes "Verified desktop installers and offline QA. Draft retained for coordinated platform deployment." \
              || gh release view "$tag" --json isDraft >/dev/null
          fi
          test "$(gh release view "$tag" --json isDraft --jq '.isDraft')" = true
          python - <<'PY'
          import hashlib,json,os,pathlib,zipfile
          root=pathlib.Path("release")
          files=[p for p in root.iterdir() if p.suffix in {".exe",".dmg",".zip"}]
          assert files,"No installer was produced"
          manifest={"commit":os.environ["GITHUB_SHA"],"os":os.environ["RUNNER_OS"],
            "arch":os.environ["RUNNER_ARCH"],"artifacts":{}}
          for p in files:
              manifest["artifacts"][p.name]={"sha256":hashlib.sha256(p.read_bytes()).hexdigest(),"size":p.stat().st_size}
          prefix=root/("verified-"+os.environ["RUNNER_OS"])
          prefix.with_suffix(".json").write_text(json.dumps(manifest,indent=2),encoding="utf-8")
          with zipfile.ZipFile(str(prefix)+"-qa.zip","w",zipfile.ZIP_DEFLATED) as archive:
              for p in pathlib.Path("test-results").rglob("*"):
                  if p.is_file():archive.write(p,p.relative_to("test-results"))
          PY
          for asset in release/*.exe release/*.dmg release/*.zip release/verified-*.json; do
            if [ -f "$asset" ]; then gh release upload "$tag" "$asset" --clobber; fi
          done
  native-probe:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.nativeProbe == true && inputs.deliverPrivate != true }}
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: "11.25.0"
      - uses: actions/setup-python@v5
        if: ${{ inputs.nativeWorkbench == true }}
        with:
          python-version: "3.12"
      - name: Install isolated inspection dependencies
        working-directory: hr-desktop/client-workbench
        run: pnpm install --ignore-workspace --ignore-scripts --frozen-lockfile
      - name: Verify local inspector driver with real Node fixtures
        run: node --test hr-desktop/client-workbench/*.test.cjs hr-desktop/test/core.test.cjs
      - name: Build Windows worker for the isolated workbench
        if: ${{ inputs.nativeWorkbench == true }}
        run: |
          python -m unittest discover -s hr-desktop/runtime -p test_build_manifest.py
          python hr-desktop/runtime/install.py
          python hr-desktop/runtime/build.py
      - name: Check both invitation workflows with isolated platform fixtures
        if: ${{ inputs.nativeWorkbench == true }}
        env:
          PYTHONPATH: hr-desktop/runtime/build/shared
        run: |
          python -m unittest discover -s hr-desktop/runtime -p test_invitation_lifecycle.py
          python -m unittest discover -s scripts/boss-agent -p test_hr_account_identity.py
      - name: Check receipt scheduling and configured request ceiling
        if: ${{ inputs.nativeWorkbench == true }}
        env:
          PYTHONPATH: hr-desktop/runtime/build/shared
        run: |
          python -m unittest discover -s hr-desktop/runtime -p test_desktop_budget.py
          python -m unittest discover -s hr-desktop/runtime -p test_passive_runtime.py
          python -m unittest discover -s hr-desktop/runtime -p test_boss_chat_receipts.py
          python -m unittest discover -s hr-desktop/runtime -p test_resume_reuse.py
          python -m unittest discover -s hr-desktop/runtime -p test_recommendation_budget.py
          python -m unittest discover -s hr-desktop/runtime -p test_managed_jobs.py
      - name: Check private candidate export boundaries
        if: ${{ inputs.nativeWorkbench == true }}
        run: |
          foreach ($file in @('scripts/ci/windows-native-probe.ps1', 'scripts/ci/windows-installation-smoke.ps1')) {
            $tokens = $null
            $syntaxErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $file), [ref]$tokens, [ref]$syntaxErrors) | Out-Null
            if ($syntaxErrors.Count) { throw ($syntaxErrors | Out-String) }
          }
          python -m unittest discover -s scripts/ci -p test_export_workbench.py
          python -m unittest discover -s hr-desktop/client-workbench -p test_windows_entry.py
          python -m unittest discover -s hr-desktop/client-workbench -p test_windows_installer.py
      - name: Observe pinned original runtime without network or login
        shell: pwsh
        env:
          HEYI_NATIVE_BUILD_WORKBENCH: ${{ inputs.nativeWorkbench }}
        run: ./scripts/ci/windows-native-probe.ps1
      - name: Prepare private candidate download after packaged checks
        if: ${{ always() && inputs.retainWorkbench == true && inputs.nativeWorkbench == true && github.event.repository.private == true }}
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'heyi-private-candidate-export'
          python scripts/ci/export_workbench.py --root "$env:HEYI_NATIVE_PROBE_ROOT" --output "$output" --event "$env:GITHUB_EVENT_PATH" --commit "$env:GITHUB_SHA"
          if ($LASTEXITCODE -ne 0) { throw 'Verified private candidate export failed' }
          "HEYI_WORKBENCH_EXPORT=$output" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Retain private candidate temporarily
        if: ${{ always() && inputs.retainWorkbench == true && github.event.repository.private == true && env.HEYI_WORKBENCH_EXPORT != '' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # A private draft avoids Actions artifact quota; never publish it.
          $private = gh repo view --json isPrivate --jq '.isPrivate'
          if ($LASTEXITCODE -ne 0 -or $private -ne 'true') { throw 'Private repository required' }
          $tag = "heyi-workbench-private-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $notes = Join-Path $env:RUNNER_TEMP 'heyi-private-candidate-notes.txt'
          [IO.File]::WriteAllText($notes, "Temporary private candidate for local validation. Packaged offline checks passed. Live recruiting workflows are not yet accepted; separate original-runtime probes may remain failed. Delete this draft after downloading and verifying the candidate.")
          gh release create $tag --draft --target "$env:GITHUB_SHA" --title 'Ai boss Windows 候选验证包' --notes-file "$notes"
          if ($LASTEXITCODE -ne 0) { throw 'Private draft creation failed' }
          $draft = gh release view $tag --json isDraft --jq '.isDraft'
          if ($LASTEXITCODE -ne 0 -or $draft -ne 'true') { throw 'Candidate must remain a draft' }
          $assets = @(Get-ChildItem "$env:HEYI_WORKBENCH_EXPORT" -File | Where-Object {
            $_.Name -eq 'verification.json' -or
            $_.Name -match '^Ai-boss-Windows-candidate-[a-f0-9]{12}\.zip$' -or
            $_.Name -match '^Ai-boss-Windows-Setup-[a-f0-9]{12}\.exe$'
          } | ForEach-Object FullName)
          if ($assets.Count -ne 3) { throw 'Expected one verified installer, portable candidate and report' }
          gh release upload $tag @assets
          if ($LASTEXITCODE -ne 0) { throw 'Private draft upload failed' }
          Write-Output "HEYI_PRIVATE_CANDIDATE_TAG $tag"
  private-delivery:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deliverPrivate == true && github.event.repository.private == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s scripts/ci -p test_deliver_private_installer.py
      - name: Transfer only a verified private installer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PRIVATE_RELEASE: ${{ inputs.privateRelease }}
          UPLOAD_TICKET: ${{ secrets.HEYI_PRIVATE_INSTALLER_TRANSFER }}
        run: python scripts/ci/deliver_private_installer.py
