name: Operations
run-name: Operations ${{ inputs.action || 'monitor' }}
on:
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:
    inputs:
      action:
        description: Operation
        type: choice
        options: [doctor, notification-test]
        default: doctor

permissions:
  contents: read

jobs:
  monitor:
    if: github.repository == 'Gotit-zhx/ai-video' && vars.HEYI_OPS_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: monitoring
    concurrency:
      group: heyi-monitoring
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: develop
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          HEYI_HOST: ${{ vars.HEYI_HOST }}
          HEYI_USER: heyi-monitor
          HEYI_SSH_KEY: ${{ secrets.HEYI_MONITOR_SSH_KEY }}
          HEYI_KNOWN_HOSTS: ${{ secrets.HEYI_KNOWN_HOSTS }}
          HEYI_NOTIFICATION_TEST: ${{ inputs.action == 'notification-test' }}
        run: python3 scripts/ci/notify.py
