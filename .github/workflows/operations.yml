name: Operations
run-name: Operations ${{ inputs.action || 'monitor' }}
on:
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:
    inputs:
      action:
        description: Operation
        type: choice
        options: [doctor, notification-test, release-check]
        default: doctor

permissions:
  contents: read

jobs:
  monitor:
    if: github.repository == 'Gotit-zhx/ai-video' && vars.HEYI_OPS_ENABLED == 'true' && inputs.action != 'release-check'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: monitoring
    concurrency:
      group: heyi-monitoring
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main-tree
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          HEYI_HOST: ${{ vars.HEYI_HOST }}
          HEYI_USER: heyi-monitor
          HEYI_SSH_KEY: ${{ secrets.HEYI_MONITOR_SSH_KEY }}
          HEYI_KNOWN_HOSTS: ${{ secrets.HEYI_KNOWN_HOSTS }}
          HEYI_NOTIFICATION_TEST: ${{ inputs.action == 'notification-test' }}
        run: python3 scripts/ci/notify.py
  release-check:
    if: github.repository == 'Gotit-zhx/ai-video' && vars.HEYI_OPS_ENABLED == 'true' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main-tree' && inputs.action == 'release-check'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: monitoring
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - env:
          HEYI_HOST: ${{ vars.HEYI_HOST }}
          HEYI_USER: heyi-monitor
          HEYI_SSH_KEY: ${{ secrets.HEYI_MONITOR_SSH_KEY }}
          HEYI_KNOWN_HOSTS: ${{ secrets.HEYI_KNOWN_HOSTS }}
        run: python3 scripts/ci/host_status.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-check
          path: target/release-check/status.json
          if-no-files-found: error
          retention-days: 7
