name: Candidate artifacts
on:
  push:
    branches: ['release/**', 'hotfix/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'Gotit-zhx/ai-video' && (startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/heads/hotfix/'))
    uses: ./.github/workflows/ci.yml
  publish:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/ci/candidate.py build
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT python3 scripts/ci/smoke.py target/release/release.json --legacy-gate
      - name: Attest backend
        if: steps.build.outputs.app_changed == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/gotit-zhx/ai-video/app
          subject-digest: ${{ steps.build.outputs.app_digest }}
          push-to-registry: true
      - name: Attest frontend
        if: steps.build.outputs.frontend_changed == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-name: ghcr.io/gotit-zhx/ai-video/frontend
          subject-digest: ${{ steps.build.outputs.frontend_digest }}
          push-to-registry: true
      - name: Attest release manifest and source
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: |
            target/release/release.json
            target/release/source.tar.gz
      - name: Publish immutable candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/candidate.py publish
