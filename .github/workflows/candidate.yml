name: Candidate artifacts
on:
  workflow_dispatch:
    inputs:
      expected_head:
        description: 'Exact reviewed release/hotfix head (blank uses dispatch head)'
        type: string
        required: false
      validation_run:
        description: 'Successful trusted CI run with matching effective tree'
        type: string
        required: true
      validation_attempt:
        description: 'Exact successful CI run attempt'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: candidate-${{ github.sha }}
  cancel-in-progress: false

jobs:
  qualify:
    if: github.repository == 'Gotit-zhx/ai-video' && (startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/heads/hotfix/'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify GitHub run, attempt, tree, policy, reports and artifact digests
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ inputs.expected_head || github.sha }}
          VALIDATION_RUN: ${{ inputs.validation_run }}
          VALIDATION_ATTEMPT: ${{ inputs.validation_attempt }}
          HEYI_FAST_CI_ENABLED: ${{ vars.HEYI_FAST_CI_ENABLED || 'false' }}
          HEYI_MANIFEST_V2_ENABLED: ${{ vars.HEYI_MANIFEST_V2_ENABLED || 'false' }}
          HEYI_V2_BOOTSTRAPPED: ${{ vars.HEYI_V2_BOOTSTRAPPED || 'false' }}
        run: python3 scripts/ci/candidate.py qualify
  publish:
    name: Candidate published
    needs: qualify
    if: needs.qualify.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: build
        env:
          GH_TOKEN: ${{ github.token }}
          INITIAL_ADOPTION: ${{ vars.HEYI_CD_ENABLED != 'true' }}
          EXPECTED_HEAD: ${{ inputs.expected_head || github.sha }}
          VALIDATION_RUN: ${{ inputs.validation_run }}
          VALIDATION_ATTEMPT: ${{ inputs.validation_attempt }}
          HEYI_FAST_CI_ENABLED: ${{ vars.HEYI_FAST_CI_ENABLED || 'false' }}
          HEYI_MANIFEST_V2_ENABLED: ${{ vars.HEYI_MANIFEST_V2_ENABLED || 'false' }}
          HEYI_V2_BOOTSTRAPPED: ${{ vars.HEYI_V2_BOOTSTRAPPED || 'false' }}
          HEYI_RUNTIME_CACHE_ENABLED: ${{ vars.HEYI_RUNTIME_CACHE_ENABLED || 'false' }}
          HEYI_RUNTIME_BOOTSTRAP: ${{ vars.HEYI_RUNTIME_BOOTSTRAP || 'false' }}
        run: python3 scripts/ci/candidate.py build
      - name: Verify JAR, fonts and real media in the candidate runtime
        run: python3 scripts/ci/container.py --probe target/release/release.json
      - name: Exercise the exact candidate digest combination
        run: sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT python3 scripts/ci/smoke.py target/release/release.json --legacy-gate
      - name: Attest qualified runtime
        if: steps.build.outputs.runtime_digest != '' && vars.HEYI_RUNTIME_BOOTSTRAP == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-name: ghcr.io/gotit-zhx/ai-video/app
          subject-digest: ${{ steps.build.outputs.runtime_digest }}
          push-to-registry: true
      - name: Attest backend
        if: steps.build.outputs.app_changed == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/gotit-zhx/ai-video/app
          subject-digest: ${{ steps.build.outputs.app_digest }}
          push-to-registry: true
      - name: Attest frontend
        if: steps.build.outputs.frontend_changed == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-name: ghcr.io/gotit-zhx/ai-video/frontend
          subject-digest: ${{ steps.build.outputs.frontend_digest }}
          push-to-registry: true
      - name: Attest release manifest and source
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: |
            target/release/release.json
            target/release/source.tar.gz
      - name: Publish immutable candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/candidate.py publish
