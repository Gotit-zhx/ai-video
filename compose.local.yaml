services:
  pi-runtime:
    ports: !override
      - "127.0.0.1:8090:8090"
    extra_hosts:
      - "api.dayan.design:123.56.45.111"
      - "monotoo.shop:128.140.47.212"
  app:
    build:
      context: .
      dockerfile: Dockerfile.local
    ports: !override
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    extra_hosts:
      - "api.dayan.design:123.56.45.111"
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.local
    ports: !override
      - "127.0.0.1:${FRONTEND_PORT:-3000}:80"
      - "127.0.0.1:${FRONTEND_HTTPS_PORT:-443}:443"
    volumes: !reset []
  mysql:
    ports: !override
      - "127.0.0.1:3306:3306"
  redis:
    ports: !override
      - "127.0.0.1:6379:6379"
