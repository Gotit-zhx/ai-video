spring:
  application:
    name: ai-commerce-platform
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/ai_commerce?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:ai_commerce}
    password: ${DB_PASSWORD:ai_commerce_dev}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 30000
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:ai_commerce_dev}
      timeout: 3s
  session:
    store-type: redis
    redis:
      namespace: heyi:session
      repository-type: indexed
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

app:
  commerce-design-generation-enabled: ${APP_COMMERCE_DESIGN_GENERATION_ENABLED:false}
  default-organization-code: ${APP_TENANT_CODE:heyi}
  default-organization-name: ${APP_TENANT_NAME:赫逸智能化}
  model-secret-key: ${APP_MODEL_SECRET_KEY:local-development-model-secret-change-me}
  automation-agent-token: ${APP_AUTOMATION_AGENT_TOKEN:heyi-local-agent-dev-token}
  automation-skill-storage: ${APP_AUTOMATION_SKILL_STORAGE:/data/automation-skills}
  automation-attachment-storage: ${APP_AUTOMATION_ATTACHMENT_STORAGE:/data/automation-attachments}
  video-script-storage: ${APP_VIDEO_SCRIPT_STORAGE:/data/video-scripts}
  video-script-analysis-concurrency: ${APP_VIDEO_SCRIPT_ANALYSIS_CONCURRENCY:4}
  ai-video-task-storage: ${APP_AI_VIDEO_TASK_STORAGE:/data/ai-video-tasks}
  video:
    max-concurrent-submissions: ${APP_VIDEO_MAX_CONCURRENT_SUBMISSIONS:500}
    reference-link-secret: ${APP_VIDEO_REFERENCE_LINK_SECRET:${APP_MODEL_SECRET_KEY:local-development-model-secret-change-me}}
    reference-link-ttl: ${APP_VIDEO_REFERENCE_LINK_TTL:72h}
  public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:8080}
  allow-insecure-public-http: ${APP_ALLOW_INSECURE_PUBLIC_HTTP:false}
  social-login:
    google:
      enabled: ${APP_SOCIAL_GOOGLE_ENABLED:false}
      client-id: ${APP_SOCIAL_GOOGLE_CLIENT_ID:}
      client-secret: ${APP_SOCIAL_GOOGLE_CLIENT_SECRET:}
    wechat:
      enabled: ${APP_SOCIAL_WECHAT_ENABLED:false}
      client-id: ${APP_SOCIAL_WECHAT_CLIENT_ID:}
      client-secret: ${APP_SOCIAL_WECHAT_CLIENT_SECRET:}
  pi-runtime-url: ${APP_PI_RUNTIME_URL:http://localhost:8090}
  pi-runtime-token: ${APP_PI_RUNTIME_TOKEN:heyi-pi-runtime-dev-token}
  oss:
    enabled: ${APP_OSS_ENABLED:false}
    bucket: ${APP_OSS_BUCKET:}
    region: ${APP_OSS_REGION:cn-guangzhou}
    endpoint: ${APP_OSS_ENDPOINT:https://oss-cn-guangzhou-internal.aliyuncs.com}
    public-endpoint: ${APP_OSS_PUBLIC_ENDPOINT:https://oss-cn-guangzhou.aliyuncs.com}
    ecs-role-name: ${ALIBABA_CLOUD_ECS_METADATA:}
    signed-url-ttl: ${APP_OSS_SIGNED_URL_TTL:2h}
    signing-credentials-file: ${APP_OSS_SIGNING_CREDENTIALS_FILE:}
    direct-link-ttl: ${APP_OSS_DIRECT_LINK_TTL:72h}
    public-images: ${APP_OSS_PUBLIC_IMAGES:false}
  dispatch:
    enabled: ${APP_DISPATCH_ENABLED:true}
    worker-id: ${APP_DISPATCH_WORKER_ID:heyi-app-worker}
    worker-threads: ${APP_DISPATCH_WORKER_THREADS:8}
    max-active-tasks: ${APP_MAX_ACTIVE_TASKS:80}
    max-model-calls: ${APP_MAX_MODEL_CALLS:20}
    permit-lease: ${APP_DISPATCH_PERMIT_LEASE:30m}
  product-capture:
    extension:
      pairing-code-ttl: ${APP_PRODUCT_EXTENSION_PAIRING_CODE_TTL:5m}
      token-ttl: ${APP_PRODUCT_EXTENSION_TOKEN_TTL:8h}
    enrichment:
      auto-enabled: false
    watermark:
      provider: ${APP_PRODUCT_WATERMARK_PROVIDER:DRY_RUN}
      model-id: ${APP_PRODUCT_WATERMARK_MODEL_ID:grok-4.6}
      local-enabled: ${APP_PRODUCT_WATERMARK_LOCAL_ENABLED:false}
      local-url: ${APP_PRODUCT_WATERMARK_LOCAL_URL:http://watermark-detector:8091}
      local-token: ${APP_PRODUCT_WATERMARK_LOCAL_TOKEN:}
    publishing:
      provider: ${APP_PRODUCT_PUBLISHING_PROVIDER:DRY_RUN}
  finance:
    ads:
      app-id: ${APP_TIKTOK_ADS_APP_ID:}
      app-secret: ${APP_TIKTOK_ADS_APP_SECRET:}
      credentials-file: ${APP_TIKTOK_ADS_CREDENTIALS_FILE:}
  shop-auth:
    state-ttl: ${APP_SHOP_AUTH_STATE_TTL:1h}
    credential-key: ${APP_SHOP_CREDENTIAL_KEY:local-development-shop-secret-change-me}
    callback-base-url: ${APP_SHOP_AUTH_CALLBACK_BASE_URL:${APP_PUBLIC_BASE_URL:http://localhost:8080}}
    frontend-base-url: ${APP_SHOP_AUTH_FRONTEND_BASE_URL:http://localhost:3000}
    live-publishing-enabled: ${APP_SHOP_LIVE_PUBLISHING_ENABLED:false}
    token-refresh-skew: ${APP_SHOP_TOKEN_REFRESH_SKEW:5m}
    shopee:
      enabled: ${APP_SHOPEE_ENABLED:false}
      sandbox-only: ${APP_SHOPEE_SANDBOX_ONLY:false}
      partner-id: ${APP_SHOPEE_PARTNER_ID:}
      partner-key: ${APP_SHOPEE_PARTNER_KEY:}
      auth-base-url: ${APP_SHOPEE_AUTH_BASE_URL:https://open.shopee.com}
      api-base-url: ${APP_SHOPEE_API_BASE_URL:https://partner.shopeemobile.com}
      image-upload-sign-scope: ${APP_SHOPEE_IMAGE_UPLOAD_SIGN_SCOPE:SHOP}
    tiktok-shop:
      enabled: ${APP_TIKTOK_SHOP_ENABLED:false}
      service-id: ${APP_TIKTOK_SHOP_SERVICE_ID:}
      app-key: ${APP_TIKTOK_SHOP_APP_KEY:}
      app-secret: ${APP_TIKTOK_SHOP_APP_SECRET:}
      authorization-base-url: ${APP_TIKTOK_SHOP_AUTHORIZATION_BASE_URL:https://services.tiktokshop.com}
      token-base-url: ${APP_TIKTOK_SHOP_TOKEN_BASE_URL:${APP_TIKTOK_SHOP_AUTH_BASE_URL:https://auth.tiktok-shops.com}}
      api-base-url: ${APP_TIKTOK_SHOP_API_BASE_URL:https://open-api.tiktokglobalshop.com}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: org.apache.ibatis.type.EnumTypeHandler
  global-config:
    banner: false
    db-config:
      id-type: assign_uuid
  type-aliases-package: com.yingdao.aicommerce.**.domain

server:
  port: ${APP_PORT:8080}
  forward-headers-strategy: framework
  shutdown: graceful
  servlet:
    session:
      timeout: 8h
      cookie:
        name: HEYI_SESSION
        http-only: true
        secure: ${APP_SESSION_COOKIE_SECURE:true}
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

logging:
  level:
    root: INFO
    com.yingdao.aicommerce: INFO
