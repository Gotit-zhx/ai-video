limit_req_zone $binary_remote_addr zone=login_per_ip:10m rate=10r/m;

log_format safe '$remote_addr - $remote_user [$time_local] '
                '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                '"$http_referer" "$http_user_agent"';

map "$scheme:$host" $redirect_domain_to_https {
    default 0;
    "http:hoyee.org.cn" 1;
    "http:www.hoyee.org.cn" 1;
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.hoyee.org.cn;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/hoyee.org.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hoyee.org.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    return 301 https://hoyee.org.cn$request_uri;
}

server {
    listen 80 default_server;
    listen 443 ssl default_server;
    http2 on;
    server_name hoyee.org.cn _;
    server_tokens off;
    client_max_body_size 100m;
    access_log /var/log/nginx/access.log safe;
    # Public static text only; authenticated API responses are not gzip-enabled here.
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $app_backend app:8080;

    ssl_certificate /etc/letsencrypt/live/hoyee.org.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hoyee.org.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    if ($redirect_domain_to_https) {
        return 301 https://hoyee.org.cn$request_uri;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; object-src 'none'; frame-src 'self' blob:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https: http://127.0.0.1:17861; font-src 'self' data:" always;

    # Only this static, non-authenticated animation document is embedded by the workbench.
    location = /commerce-motion-demo.html {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'none'" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri =404;
    }


    root /usr/share/nginx/html;
    index index.html;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    # BEGIN HOYEE ERP - isolated application
    location = /erphoyee {
        return 302 /erphoyee/;
    }
    location ^~ /erphoyee/ {
        set $erp_backend erphoyee:8137;
        proxy_pass http://$erp_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 45s;
        proxy_send_timeout 45s;
        client_max_body_size 32k;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        access_log off;
    }
    # END HOYEE ERP

    # Private recruiter bridge; its server validates the existing login session.
    location ^~ /api/v1/hr/ {
        access_log off;
        proxy_pass http://172.18.0.1:8765;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 240s;
        proxy_cache off;
        add_header Cache-Control "no-store" always;
    }

    location /api/ {
        proxy_pass http://$app_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        client_body_buffer_size 10m;
        proxy_send_timeout 1h;
        proxy_read_timeout 1h;
    }

    location = /api/v1/auth/login {
        limit_req zone=login_per_ip burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://$app_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
    }

    location = /_heyi/ops/status { return 404; }

    location /actuator/ {
        proxy_pass http://$app_backend;
        proxy_set_header Host $host;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; object-src 'none'; frame-src 'self' blob:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https: http://127.0.0.1:17861; font-src 'self' data:" always;
    }

    location ~* \.(css|js)$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; object-src 'none'; frame-src 'self' blob:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https: http://127.0.0.1:17861; font-src 'self' data:" always;
        try_files $uri =404;
    }

    location = /downloads/hoyee-assistant-0.2.4.zip {
        alias /usr/share/nginx/html/plugin-downloads/hoyee-assistant-0.2.4.zip;
        default_type application/zip;
        add_header Content-Disposition 'attachment; filename="hoyee-assistant-0.2.4.zip"';
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /downloads/Heyi-Recruiter-mac-arm64.dmg {
        access_log off;
        proxy_pass http://172.18.0.1:8767;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_cache off;
        proxy_redirect off;
        add_header Cache-Control "private, no-store" always;
    }

    location = /downloads/Heyi-Recruiter-windows-x64-Setup.exe {
        access_log off;
        proxy_pass http://172.18.0.1:8767;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_cache off;
        proxy_redirect off;
        add_header Cache-Control "private, no-store" always;
    }

    location = /downloads/hoyee-assistant-0.2.5.zip {
        alias /usr/share/nginx/html/plugin-downloads/hoyee-assistant-0.2.5.zip;
        default_type application/zip;
        add_header Content-Disposition 'attachment; filename="hoyee-assistant-0.2.5.zip"';
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /downloads/hoyee-assistant-0.2.6.zip {
        alias /usr/share/nginx/html/plugin-downloads/hoyee-assistant-0.2.6.zip;
        default_type application/zip;
        add_header Content-Disposition 'attachment; filename="hoyee-assistant-0.2.6.zip"';
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /downloads/hoyee-assistant-0.2.7.zip {
        alias /usr/share/nginx/html/plugin-downloads/hoyee-assistant-0.2.7.zip;
        default_type application/zip;
        add_header Content-Disposition 'attachment; filename="hoyee-assistant-0.2.7.zip"';
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /downloads/hoyee-assistant-0.2.8.zip {
        alias /usr/share/nginx/html/plugin-downloads/hoyee-assistant-0.2.8.zip;
        default_type application/zip;
        add_header Content-Disposition 'attachment; filename="hoyee-assistant-0.2.8.zip"';
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /downloads/hoyee-assistant-latest.zip {
        add_header Cache-Control "no-store" always;
        return 302 /downloads/hoyee-assistant-0.2.8.zip;
    }

    location ^~ /downloads/ {
        default_type application/octet-stream;
        add_header Content-Disposition "attachment";
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
