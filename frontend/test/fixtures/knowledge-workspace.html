<!doctype html><html lang="zh-CN" data-theme="light"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/resend-theme.css"><link rel="stylesheet" href="/i18n.css"><link rel="stylesheet" href="/knowledge-workspace.css"><title>Knowledge workspace isolated QA</title><style>body{overflow:auto}.qa-shell{display:grid;grid-template-columns:205px 1fr;min-height:100vh}.qa-nav{padding:25px 15px;border-right:1px solid var(--line)}.qa-nav .nav-label,.qa-nav .nav-group-label{opacity:1;visibility:visible;color:var(--ink);font-size:13px}.qa-nav a{display:block;padding:12px;text-decoration:none}.qa-main{min-width:0}.qa-main>.topbar{position:static;padding:16px 28px;display:flex;justify-content:space-between;height:auto;border-bottom:1px solid var(--line)}.qa-main>.topbar h2{font-size:15px}.qa-main .user-area{display:flex}#knowledge-page{width:100%}@media(max-width:650px){.qa-shell{display:block}.qa-nav{display:none}.qa-main>.topbar{padding:12px}}</style></head><body>
<div class="qa-shell"><aside class="qa-nav"><p><b>HOYEE</b></p><details class="nav-group" data-nav-group="knowledge" translate="no" open><summary><span class="nav-group-label">知识库</span></summary><div class="nav-children">
<a href="#knowledge-shop" data-knowledge-route="shop"><span class="nav-label"></span></a><a href="#knowledge-influencer" data-knowledge-route="influencer"><span class="nav-label"></span></a><a href="#knowledge-video" data-knowledge-route="video"><span class="nav-label"></span></a><a href="#knowledge-system" data-knowledge-route="system"><span class="nav-label"></span></a><a href="#knowledge-faq" data-knowledge-route="faq"><span class="nav-label"></span></a></div></details></aside>
<main class="qa-main"><div class="topbar"><h2>知识库</h2><div class="user-area"></div></div><section id="knowledge-page" class="workspace-body"></section></main></div>
<script>
// This isolated QA fixture is the only mock API. Production knowledge-workspace.js always calls the authenticated server API.
let currentUser={roles:['ADMIN'],permissions:[],organizationId:'test-a'},activeWorkspace='knowledge';
function switchWorkspace(value){activeWorkspace=value;document.getElementById('knowledge-page').hidden=value!=='knowledge';}
const sample=(id,category,status,title,body)=>({id,category,status,title,body,summary:'企业操作流程与排查步骤，可由管理员持续维护。',language:'zh',platform:'ALL',market:'ALL',version:1,tags:['使用说明'],sourceLabel:'平台操作说明',sourceUrl:'https://example.com/guide',retrievalEnabled:true,updatedAt:'2026-09-22T16:00:00'});
const qa={requests:[],pending:[],hold:'',articles:[sample('shop-one','shop','PUBLISHED','店铺授权与上架前准备','复制店铺授权链接，在对应店铺网络环境中完成授权。\n核对店铺名称、市场与物流，再提交商品。'),sample('shop-two','shop','DRAFT','店铺物流排查记录','待管理员补充的排查记录'),sample('system-xss','system','PUBLISHED','<img src=x onerror="window.__xss=1">','<scr'+'ipt>window.__xss=1</scr'+'ipt>\n这段正文应作为文字显示。')],history:{},setUser(roles,permissions,org='test-a'){currentUser={roles,permissions,organizationId:org};window.dispatchEvent(new Event('heyi:company-reset'));},release(){const pending=this.pending.splice(0);this.hold='';pending.forEach(resolve=>resolve());}};
window.__kbTest=qa;
async function api(path,options={}){
 const user=structuredClone(currentUser);const method=options.method||'GET';qa.requests.push({path,method,body:options.body?JSON.parse(options.body):null,organizationId:user?.organizationId});
 const route=new URL(path,location.origin);const all=user?.organizationId==='test-a'?qa.articles:[];
 const editor=user?.roles.includes('ADMIN')||user?.permissions.includes('knowledge:edit');const publisher=user?.roles.includes('ADMIN')||user?.permissions.includes('knowledge:publish');
 let data;const id=route.pathname.split('/')[5];
 if(route.pathname.endsWith('/versions'))data=qa.history[id]||[{version:1,createdAt:'2026-09-22T16:00:00',article:all.find(a=>a.id===id)}];
 else if(route.pathname.endsWith('/status')){const prior=all.find(a=>a.id===id),input=JSON.parse(options.body);if(prior.version!==input.version)throw Object.assign(Error('文章已被更新，请刷新后重试'),{status:409});prior.status=input.status;prior.version++;data=prior;}
 else if(method==='POST'||method==='PUT'){
  const input=JSON.parse(options.body);const prior=all.find(a=>a.id===id);if(prior&&prior.version!==input.version)throw Object.assign(Error('文章已被更新，请刷新后重试'),{status:409});
  data={...input,id:id||'article-'+(all.length+1),version:prior?prior.version+1:1,updatedAt:'2026-09-22T17:00:00'};if(prior)all.splice(all.indexOf(prior),1);all.push(data);(qa.history[data.id]??=[]).unshift({version:data.version,createdAt:data.updatedAt,article:structuredClone(data)});
 } else if(id)data=all.find(a=>a.id===id);
 else{const p=route.searchParams;const selected=all.filter(a=>(!p.get('category')||a.category===p.get('category'))&&(!p.get('language')||a.language===p.get('language'))&&(!p.get('q')||[a.title,a.body,a.summary].some(t=>t.includes(p.get('q'))))&&((editor||publisher)?(!p.get('status')?a.status!=='ARCHIVED':a.status===p.get('status')):a.status==='PUBLISHED'));data={items:selected,total:selected.length,canEdit:editor,canPublish:publisher,libraryEmpty:all.length===0};}
 data=structuredClone(data);if(qa.hold&&path.includes(qa.hold))await new Promise(resolve=>qa.pending.push(resolve));if(!data)throw Object.assign(Error('文章不存在'),{status:404});return {data};
}
window.addEventListener('hashchange',()=>{if(location.hash.startsWith('#knowledge-')){switchWorkspace('knowledge');KnowledgeWorkspace.enter(location.hash.slice(1));}});
window.addEventListener('DOMContentLoaded',()=>KnowledgeWorkspace.enter('knowledge-shop'));
</script><script src="/i18n.js"></script><script src="/knowledge-workspace.js"></script></body></html>
