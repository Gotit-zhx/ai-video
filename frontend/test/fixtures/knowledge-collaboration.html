<!doctype html><html lang="zh-CN" data-theme="light"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/resend-theme.css"><link rel="stylesheet" href="/i18n.css"><link rel="stylesheet" href="/knowledge-workspace.css"><title>Knowledge workspace isolated QA</title><style>body{overflow:auto}.qa-shell{display:grid;grid-template-columns:205px 1fr;min-height:100vh}.qa-nav{padding:25px 15px;border-right:1px solid var(--line)}.qa-nav .nav-label,.qa-nav .nav-group-label{opacity:1;visibility:visible;color:var(--ink);font-size:13px}.qa-nav a{display:block;padding:12px;text-decoration:none}.qa-main{min-width:0}.qa-main>.topbar{position:static;padding:16px 28px;display:flex;justify-content:space-between;height:auto;border-bottom:1px solid var(--line)}.qa-main>.topbar h2{font-size:15px}.qa-main .user-area{display:flex}#knowledge-page{width:100%}@media(max-width:650px){.qa-shell{display:block}.qa-nav{display:none}.qa-main>.topbar{padding:12px}}</style></head><body>
<div class="qa-shell"><aside class="qa-nav"><p><b>HOYEE</b></p><details class="nav-group" data-nav-group="knowledge" translate="no" open><summary><span class="nav-group-label">知识库</span></summary><div class="nav-children">
<a href="#knowledge-shop" data-knowledge-route="shop"><span class="nav-label"></span></a><a href="#knowledge-influencer" data-knowledge-route="influencer"><span class="nav-label"></span></a><a href="#knowledge-video" data-knowledge-route="video"><span class="nav-label"></span></a><a href="#knowledge-system" data-knowledge-route="system"><span class="nav-label"></span></a><a href="#knowledge-faq" data-knowledge-route="faq"><span class="nav-label"></span></a></div></details></aside>
<main class="qa-main"><div class="topbar"><h2>知识库</h2><div class="user-area"></div></div><section id="knowledge-page" class="workspace-body"></section></main></div>
<script>
// Isolated QA fixture: production UI and language module, no real API writes.
let currentUser={roles:[],permissions:[],organizationId:'test-a'},activeWorkspace='knowledge';
function switchWorkspace(value){activeWorkspace=value;document.getElementById('knowledge-page').hidden=value!=='knowledge';}
const sample={id:'article-one',category:'shop',status:'PUBLISHED',title:'团队操作指南',body:'真实文章正文，仅用于本地交互验证。',summary:'HIDDEN_SUMMARY',language:'ms',platform:'SHOPEE',market:'MY',version:1,tags:['操作'],retrievalEnabled:true,updatedAt:'2026-09-22T09:00:00Z'};
const qa={requests:[],articles:[sample],files:[],fileLogs:[],history:{},writer:true,failFirst:new Set(['retry.txt']),nullFirst:new Set(['null-ack.txt']),uploadCounts:{},hold:'',pending:[],setUser(admin=false,org='test-a'){currentUser={roles:admin?['ADMIN']:[],permissions:[],organizationId:org};window.dispatchEvent(new Event('heyi:company-reset'));},release(){this.hold='';this.pending.splice(0).forEach(r=>r());}};
window.__kbQA=qa;const clone=x=>structuredClone(x);const actor={userId:'test-member-id',displayName:'编辑成员',username:'editor',identitySource:'SNAPSHOT'};const fail=(message,status)=>Object.assign(Error(message),{status});
qa.history[sample.id]=[{version:1,fromVersion:0,toVersion:1,createdAt:'2026-09-22T09:00:00Z',action:'CREATE',actor,changes:[{field:'title',before:null,after:sample.title},{field:'body',before:null,after:sample.body}],article:clone(sample)}];
qa.files.push({id:'file-initial',articleId:null,category:'shop',fileName:'原始资料.pdf',sizeBytes:2048,version:1,status:'ACTIVE',extractionStatus:'STORED_ONLY',createdAt:'2026-09-22T08:00:00Z'});
async function api(path,options={}){
 const url=new URL(path,location.origin),method=options.method||'GET',id=url.pathname.split('/')[5],isAdmin=currentUser.roles.includes('ADMIN'),scope=currentUser.organizationId;
 const body=options.body instanceof FormData?Object.fromEntries([...options.body.entries()].map(([k,v])=>[k,v instanceof File?{name:v.name,size:v.size}:v])):options.body?JSON.parse(options.body):null;
 qa.requests.push({path,method,body,scope});let data;const articles=scope==='test-a'?qa.articles:[],files=scope==='test-a'?qa.files:[];
 if(path.includes('/files/audit')){if(!isAdmin)throw fail('仅管理员可查看操作记录',403);data=qa.fileLogs.filter(r=>url.searchParams.get('articleId')?r.file.articleId===url.searchParams.get('articleId'):!r.file.articleId&&r.file.category===url.searchParams.get('category'));}
 else if(url.pathname.includes('/files')){
  if(method==='POST'){const requestId=body.requestId;qa.uploadCounts[requestId]=(qa.uploadCounts[requestId]||0)+1;let file=files.find(f=>f.requestId===requestId);if(!file){file={id:'file-'+files.length,articleId:body.articleId||null,category:body.category||articles.find(a=>a.id===body.articleId)?.category,fileName:body.file.name,sizeBytes:body.file.size,requestId,version:1,status:'ACTIVE',extractionStatus:body.file.name.endsWith('.txt')?'EXTRACTED':'STORED_ONLY',createdAt:new Date().toISOString()};files.push(file);qa.fileLogs.unshift({action:'UPLOAD',createdAt:file.createdAt,actor,fromVersion:0,toVersion:1,fileName:file.fileName,file:clone(file)});}if(qa.failFirst.delete(body.file.name))throw fail('上传连接中断，可重试继续',0);if(qa.nullFirst.delete(body.file.name))return null;data={file:clone(file),replayed:qa.uploadCounts[requestId]>1};}
  else if(method==='DELETE'){const file=files.find(f=>f.id===id);if(Number(url.searchParams.get('version'))!==file.version)throw fail('文件已被修改',409);file.status='REMOVED';file.version++;qa.fileLogs.unshift({action:'REMOVE',createdAt:new Date().toISOString(),actor,fromVersion:file.version-1,toVersion:file.version,fileName:file.fileName,file:clone(file)});data={file:clone(file)};}
  else{const articleId=url.searchParams.get('articleId'),q=(url.searchParams.get('q')||'').toLowerCase(),page=Number(url.searchParams.get('page')||1),size=2;const rows=files.filter(f=>f.status==='ACTIVE'&&(articleId?f.articleId===articleId:!f.articleId&&f.category===url.searchParams.get('category'))&&f.fileName.toLowerCase().includes(q));data={items:rows.slice((page-1)*size,page*size),page,pageSize:size,total:rows.length,hasMore:page*size<rows.length,canAudit:isAdmin,maxFileBytes:52428800};}
 }else if(url.pathname.endsWith('/versions')){if(!isAdmin)throw fail('仅管理员可查看操作记录',403);data=qa.history[id]||[];}
 else if(method==='DELETE'){const prior=articles.find(a=>a.id===id);if(!prior)throw fail('文章不存在',404);if(prior.version!==body.version||prior.status==='ARCHIVED')throw fail('文章已被更新，请刷新后重试',409);data={...prior,status:'ARCHIVED',version:prior.version+1};articles.splice(articles.indexOf(prior),1,data);(qa.history[id]??=[]).unshift({version:data.version,fromVersion:prior.version,toVersion:data.version,createdAt:new Date().toISOString(),action:'DELETE',actor,changes:[{field:'status',before:prior.status,after:data.status}],article:clone(data)});}
 else if(method==='POST'||method==='PUT'){const prior=articles.find(a=>a.id===id);if(prior&&prior.version!==body.version)throw fail('文章已被更新，请刷新后重试',409);data={...clone(prior||{status:'PUBLISHED',language:'zh',market:'ALL',platform:'ALL',summary:''}),...body,id:id||'article-'+articles.length,version:prior?prior.version+1:1,updatedAt:new Date().toISOString()};const changes=['title','body','tags'].filter(k=>JSON.stringify(prior?.[k])!==JSON.stringify(data[k])).map(k=>({field:k,before:prior?.[k]||null,after:data[k]}));if(prior)articles.splice(articles.indexOf(prior),1);articles.push(data);(qa.history[data.id]??=[]).unshift({version:data.version,fromVersion:data.version-1,toVersion:data.version,createdAt:data.updatedAt,action:prior?'EDIT':'CREATE',actor,changes,article:clone(data)});}
 else if(id)data=articles.find(a=>a.id===id);
 else{const p=url.searchParams,rows=articles.filter(a=>a.status!=='ARCHIVED'&&a.category===p.get('category')&&(!p.get('q')||[a.title,a.body].some(v=>v.includes(p.get('q')))));data={items:rows,total:rows.length,canEdit:qa.writer,canPublish:isAdmin,canAudit:isAdmin};}
 data=clone(data);if(qa.hold&&path.includes(qa.hold))await new Promise(r=>qa.pending.push(r));if(!data)throw fail('不存在',404);return{data};
}
window.addEventListener('hashchange',()=>{if(location.hash.startsWith('#knowledge-'))KnowledgeWorkspace.enter(location.hash.slice(1));});
window.addEventListener('DOMContentLoaded',()=>KnowledgeWorkspace.enter('knowledge-shop'));
</script><script src="/i18n.js"></script><script src="/knowledge-workspace.js"></script></body></html>
