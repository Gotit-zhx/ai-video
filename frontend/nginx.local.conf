log_format local_safe '$remote_addr [$time_local] '
                      '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                      '"$http_user_agent"';

# cpolar terminates public TLS before forwarding traffic to this HTTP listener.
# Trust only a syntactically valid first forwarded-protocol value; direct localhost
# requests have no such header and continue to use their real $scheme.
map $http_x_forwarded_proto $local_forwarded_proto {
    "~*^https(?:\s*,|$)" https;
    "~*^http(?:\s*,|$)"  http;
    default               $scheme;
}

# Redirect only when an upstream proxy explicitly says the public request used
# HTTP. A direct http://localhost:3000 request has no header, so it cannot loop.
map $http_x_forwarded_proto $local_redirect_https {
    "~*^http(?:\s*,|$)" 1;
    default              0;
}

map $local_forwarded_proto $local_hsts {
    https   "max-age=31536000";
    default "";
}

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    client_max_body_size 100m;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $app_backend app:8080;
    root /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/access.log local_safe;

    if ($local_redirect_https) {
        return 308 https://$host$request_uri;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security $local_hsts always;

    location = /modern { return 404; }
    location ^~ /modern/ { return 404; }
    location = /modern-build.mjs { return 404; }

    # Authorization codes and OAuth state arrive in the query string. Do not
    # retain callback requests in the reverse-proxy access log.
    location ^~ /api/v1/shop-authorizations/callback/ {
        access_log off;
        proxy_pass http://$app_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $local_forwarded_proto;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_send_timeout 1h;
        proxy_read_timeout 1h;
    }

    location /api/ {
        proxy_pass http://$app_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $local_forwarded_proto;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_send_timeout 1h;
        proxy_read_timeout 1h;
    }

    # The SPA entry point must be fetched again after a new frontend image is
    # published. / and history fallbacks internally resolve to this location.
    # Defining add_header here replaces inheritance, so retain every existing
    # server-level security header, including conditional forwarded-TLS HSTS.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security $local_hsts always;
        try_files $uri =404;
    }

    location ~* \.(css|js)$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    # Only this static, non-authenticated animation document is embedded by the workbench.
    location = /commerce-motion-demo.html {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'none'" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security $local_hsts always;
        try_files $uri =404;
    }

    location / { try_files $uri $uri/ /index.html; }
}
