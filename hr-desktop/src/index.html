<!doctype html>
<html lang="zh-CN">
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'">
<title>BOSS · 赫逸招聘助手</title>
<link rel="stylesheet" href="style.css">
<body class="boss-shell">
  <div class="flow-edge" aria-hidden="true"></div>
  <header class="titlebar">
    <div class="wordmark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h4v6h6V4h4v16h-4v-6H9v6H5z"/></svg><strong>BOSS</strong><span>招聘助手</span></div>
    <div class="activity" role="status" aria-live="polite"><i></i><span id="status">准备就绪</span></div>
    <div class="window-controls">
      <button data-action="hide" title="收起到悬浮球" aria-label="收起到悬浮球"><svg viewBox="0 0 16 16"><path d="M3 8h10"/></svg></button>
      <button data-action="maximize" title="最大化或还原" aria-label="最大化或还原"><svg viewBox="0 0 16 16"><rect x="3.5" y="3.5" width="9" height="9" rx="1"/></svg></button>
      <button data-action="hide" class="close" title="关闭窗口，助手继续驻留" aria-label="关闭窗口，助手继续驻留"><svg viewBox="0 0 16 16"><path d="m4 4 8 8m0-8-8 8"/></svg></button>
    </div>
  </header>
  <div class="page-underlay" aria-hidden="true"></div>
  <script src="renderer.cjs"></script>
</body>
</html>
